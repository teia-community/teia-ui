# Keeps src/data/tag-vocabulary.json (the tags offered by "Suggest keywords"
# when minting or posting) in step with what people actually tag with.
#
# Runs on the 1st of each month and opens a pull request when the list changed,
# so the generated file still goes through main's review rule. The PR branch is
# reused, so there is at most one of these open at a time.
#
# Switching it off: set the repository variable TAG_VOCABULARY_AUTOUPDATE to
# "off" (Settings > Secrets and variables > Actions > Variables), or disable
# this workflow in the Actions tab. Unset means on. Running it by hand from the
# Actions tab works either way.

name: 🏷️ Tag vocabulary

on:
  schedule:
    - cron: '0 5 1 * *' # 05:00 UTC, 1st of the month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.TAG_VOCABULARY_AUTOUPDATE != 'off'
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/tag-vocabulary
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # No npm install: the script only uses Node built-ins and fetch.
      - name: Rebuild the tag list from the indexer
        run: node scripts/tag-vocabulary.mjs

      - name: Open or update the pull request
        run: |
          if git diff --quiet -- src/data/tag-vocabulary.json; then
            echo "Tag list unchanged, nothing to propose."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/tag-vocabulary.json
          git commit -m "Refresh the tag vocabulary"
          # The branch is reused each month, so it is replaced rather than merged.
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing pull request updated."
            exit 0
          fi

          printf '%s\n' \
            'Monthly rebuild of `src/data/tag-vocabulary.json`, the tag list behind "Suggest keywords" on the mint and text post forms.' \
            '' \
            'Generated by `scripts/tag-vocabulary.mjs` from the most recent tag rows in the indexer. Only generated data changes here: check the diff looks sane and merge.' \
            '' \
            'Switch these off with the `TAG_VOCABULARY_AUTOUPDATE` repository variable, or by disabling the workflow in the Actions tab.' \
            > pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh the tag vocabulary" \
            --body-file pr-body.md
          rm -f pr-body.md
